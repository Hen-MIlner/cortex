<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CORTEX — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/cortex.css" />
<link rel="stylesheet" href="../assets/css/page.css" />
<style>
  .chat-shell{ display:flex; flex-direction:column; height: calc(100vh - 130px); }
  .chat-window{
    flex:1; overflow-y:auto;
    background: var(--bg-panel); border:1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom:14px;
    display:flex; flex-direction:column; gap:14px;
  }
  .msg{ max-width: 70%; padding: 12px 16px; border-radius: 14px; font-size:14px; line-height:1.5; }
  .msg.user{ align-self:flex-end; background: rgba(47,184,255,0.16); border:1px solid rgba(47,184,255,0.3); }
  .msg.cortex{ align-self:flex-start; background: var(--bg-panel-2); border:1px solid var(--border); }
  .msg-row{ display:flex; flex-direction:column; }
  .chat-input-bar{ display:flex; gap:10px; align-items:center; }
  .chat-input-bar input{
    flex:1; background: var(--bg-panel); border:1px solid var(--border); color:var(--text);
    padding: 13px 16px; border-radius: 14px; font-size:14px; font-family:inherit; outline:none;
  }
  .speak-toggle{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-faint); margin-bottom:10px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#6fd6ff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8.2 9.6a2.1 2.1 0 1 1 3-1.8M15.8 9.6a2.1 2.1 0 1 0-3-1.8M8.8 15.2a2.1 2.1 0 1 0 3 1.8M15.2 15.2a2.1 2.1 0 1 1-3 1.8M12 6.2v11.6M7 12h10"/></svg></div>
      <div class="brand-text"><div class="name">CORTEX</div><div class="tag">AI Operating System</div></div>
    </div>
    <nav class="nav" id="cortex-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar">HM</div>
        <div class="user-meta"><div class="uname">Henry Milne</div><div class="ustatus"><span class="dot"></span> Online</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Chat</div>
        <div class="page-sub">Talk to CORTEX — powered by Groq, spoken back with your Fish Audio voice.</div>
      </div>
    </div>

    <div class="speak-toggle">
      <label><input type="checkbox" id="speak-toggle" checked /> Speak replies aloud</label>
    </div>

    <div class="chat-shell">
      <div class="chat-window" id="chat-window"></div>
      <div class="chat-input-bar">
        <input type="text" id="chat-input" placeholder="Ask CORTEX anything..." />
        <button class="btn-primary" id="chat-send">Send</button>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/memory.js"></script>
<script src="../assets/js/ai-engine.js"></script>
<script src="../assets/js/voice.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
  renderCortexSidebar("chat", "../");

  const win = document.getElementById("chat-window");
  const input = document.getElementById("chat-input");

  function renderMessage(role, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg-row";
    const bubble = document.createElement("div");
    bubble.className = "msg " + (role === "user" ? "user" : "cortex");
    bubble.textContent = text;
    wrap.appendChild(bubble);
    win.appendChild(wrap);
    win.scrollTop = win.scrollHeight;
  }

  // Restore history
  const history = CortexMemory.getChatHistory();
  history.forEach(m => renderMessage(m.role, m.content));
  if (history.length === 0) {
    renderMessage("cortex", "Hey, I'm CORTEX. What are we working on?");
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    renderMessage("user", text);
    CortexMemory.appendChat({ role: "user", content: text });
    input.value = "";

    renderMessage("cortex", "…thinking");
    const thinkingBubble = win.lastChild.querySelector(".msg");

    try {
      const messages = CortexMemory.getChatHistory().map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.content }));
      const reply = await CortexAI.ask([
        { role: "system", content: "You are CORTEX, Henry's personal AI operating system assistant. Be concise, direct, and helpful." },
        ...messages,
      ]);
      thinkingBubble.textContent = reply;
      CortexMemory.appendChat({ role: "assistant", content: reply });
      CortexMemory.addMemory({ text: `CORTEX replied: ${reply.slice(0, 60)}...` });

      if (document.getElementById("speak-toggle").checked) {
        CortexVoice.speak(reply).catch(e => console.warn("Voice playback failed:", e));
      }
    } catch (e) {
      thinkingBubble.textContent = "Error: " + e.message;
    }
  }

  document.getElementById("chat-send").addEventListener("click", () => sendMessage(input.value));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(input.value); });

  // Pending prompt from dashboard ask-bar
  const pending = sessionStorage.getItem("cortex_pending_prompt");
  if (pending) {
    sessionStorage.removeItem("cortex_pending_prompt");
    sendMessage(pending);
  }
</script>
</body>
</html>
