<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CORTEX — Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/cortex.css" />
<link rel="stylesheet" href="../assets/css/page.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#6fd6ff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8.2 9.6a2.1 2.1 0 1 1 3-1.8M15.8 9.6a2.1 2.1 0 1 0-3-1.8M8.8 15.2a2.1 2.1 0 1 0 3 1.8M15.2 15.2a2.1 2.1 0 1 1-3 1.8M12 6.2v11.6M7 12h10"/></svg></div>
      <div class="brand-text"><div class="name">CORTEX</div><div class="tag">AI Operating System</div></div>
    </div>
    <nav class="nav" id="cortex-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar">HM</div>
        <div class="user-meta"><div class="uname">Henry Milne</div><div class="ustatus"><span class="dot"></span> Online</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Tasks</div>
        <div class="page-sub">Everything you need to get done.</div>
      </div>
    </div>

    <div class="simple-panel">
      <div class="input-row">
        <input type="text" id="task-input" placeholder="Add a new task..." />
        <button class="btn-primary" id="task-add">Add</button>
      </div>
      <div id="task-list"></div>
      <div id="task-empty" class="empty-state" style="display:none;">No tasks yet. Add your first one above.</div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/memory.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
  renderCortexSidebar("tasks", "../");

  function render() {
    const tasks = CortexMemory.getTasks();
    const list = document.getElementById("task-list");
    const empty = document.getElementById("task-empty");
    if (tasks.length === 0) { list.innerHTML = ""; empty.style.display = "block"; return; }
    empty.style.display = "none";
    list.innerHTML = tasks.map(t => `
      <div class="list-item ${t.done ? 'done' : ''}">
        <input type="checkbox" data-id="${t.id}" ${t.done ? "checked" : ""}/>
        <div class="li-title">${t.title}</div>
      </div>
    `).join("");
    list.querySelectorAll("input[type=checkbox]").forEach(cb => {
      cb.addEventListener("change", () => {
        const tasks = CortexMemory.getTasks();
        const t = tasks.find(x => x.id == cb.dataset.id);
        if (t) t.done = cb.checked;
        CortexMemory.setTasks(tasks);
        render();
      });
    });
  }

  document.getElementById("task-add").addEventListener("click", () => {
    const input = document.getElementById("task-input");
    if (!input.value.trim()) return;
    CortexMemory.addTask({ title: input.value.trim() });
    input.value = "";
    render();
  });
  document.getElementById("task-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("task-add").click();
  });

  render();
</script>
</body>
</html>
